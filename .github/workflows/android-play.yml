name: Prepare Google Play bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Signed Play upload bundle
    runs-on: ubuntu-24.04
    env:
      SELE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_PLAY_STORE_PASSWORD }}
      SELE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_PLAY_KEY_ALIAS }}
      SELE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_PLAY_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
      - name: Set up JDK 21 and Gradle cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Install dependencies
        run: npm ci
      - name: Restore Play upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_PLAY_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$UPLOAD_KEYSTORE_BASE64" ]]; then
            echo '::error::Configure the four ANDROID_PLAY_* signing secrets before preparing a bundle.'
            exit 1
          fi
          upload_key="$RUNNER_TEMP/sele-play-upload.p12"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$upload_key"
          chmod 600 "$upload_key"
          echo "SELE_ANDROID_KEYSTORE=$upload_key" >> "$GITHUB_ENV"
      - name: Build signed release bundle
        run: npm run build:android:play
      - name: Android release lint and unit tests
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 lintRelease testReleaseUnitTest
      - name: Download verified bundletool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.18.3 --repo google/bundletool --pattern bundletool-all-1.18.3.jar --dir "$RUNNER_TEMP"
          printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' "$RUNNER_TEMP/bundletool-all-1.18.3.jar" | sha256sum --check
      - name: Verify production bundle
        run: |
          bundle="dist/sele-$(node -p "require('./package.json').version")-android-release.aab"
          node scripts/verify-android-play.mjs "$bundle" "$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          keytool -exportcert -rfc -keystore "$SELE_ANDROID_KEYSTORE" -storepass:env SELE_ANDROID_STORE_PASSWORD -alias "$SELE_ANDROID_KEY_ALIAS" -file dist/play-upload-certificate.pem
      - name: Upload release preparation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sele-google-play
          path: |
            dist/*-android-release.aab
            dist/*-android-release.aab.sha256
            dist/*-android-release.aab.verification.json
            dist/play-upload-certificate.pem
            fastlane/metadata/android
          if-no-files-found: error
          compression-level: 0
      - name: Remove restored private key
        if: always()
        run: rm -f "$RUNNER_TEMP/sele-play-upload.p12"
