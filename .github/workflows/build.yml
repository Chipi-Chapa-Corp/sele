name: Build distributables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: 22.23.1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v${tag_version} does not match package.json version ${package_version}." >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

  windows:
    name: Windows x64
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run build:win -- --x64
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/sele-windows-x64-setup.exe")) {
            throw "Windows installer was not produced."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: sele-windows-x64
          path: dist/sele-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Homebrew cask
        run: |
          ruby -c Casks/sele.rb
          brew style Casks/sele.rb

      - name: Build DMG
        run: npm run build:mac -- --${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify artifact
        run: hdiutil verify "dist/sele-macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: sele-macos-${{ matrix.arch }}
          path: dist/sele-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x64 Flatpak
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --assumeyes --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Install dependencies
        run: npm ci

      - name: Build Flatpak bundle
        run: npm run build:linux -- --x64

      - name: Verify artifact
        run: test -f dist/sele-linux-x64.flatpak

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: sele-linux-x64
          path: dist/sele-linux-x64.flatpak
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
      - linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download distributables
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: sele-*
          merge-multiple: true

      - name: Verify release contents
        run: |
          test -f release-artifacts/sele-windows-x64-setup.exe
          test -f release-artifacts/sele-macos-arm64.dmg
          test -f release-artifacts/sele-macos-x64.dmg
          test -f release-artifacts/sele-linux-x64.flatpak

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
            exit 0
          fi

          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --generate-notes \
            --title "Sele ${GITHUB_REF_NAME#v}" \
            "${prerelease_args[@]}"
