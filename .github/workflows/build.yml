name: Build distributables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: 22.23.1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v${tag_version} does not match package.json version ${package_version}." >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

  windows:
    name: Windows x64
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }

          npm run build:win -- --x64 --publish never

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/sele-windows-x64-setup.exe")) {
            throw "Windows installer was not produced."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: sele-windows-x64
          path: dist/sele-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS arm64
    needs: validate
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Homebrew cask
        run: |
          ruby -c Casks/sele.rb
          brew style Casks/sele.rb

      - name: Build DMG
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          npm run build:mac -- --arm64 --publish never

      - name: Verify artifact
        run: hdiutil verify "dist/sele-macos-arm64.dmg"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: sele-macos-arm64
          path: dist/sele-macos-arm64.dmg
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x64 Flatpak
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --assumeyes --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Install dependencies
        run: npm ci

      - name: Validate AppStream metadata
        run: appstreamcli validate --strict --explain build/com.chipichapa.sele.metainfo.xml

      - name: Build Flatpak bundle
        run: npm run build:linux -- --x64 --publish never

      - name: Build Flatpak update repository
        run: npm run package:flatpak-repo

      - name: Verify artifact
        run: |
          test -f dist/sele-linux-x64.flatpak
          test -f dist/flatpak-pages/flatpak/summary
          test -f dist/flatpak-pages/flatpak/sele.flatpakref
          flatpak remote-add --user --no-gpg-verify sele-build \
            "file://${GITHUB_WORKSPACE}/dist/flatpak-pages/flatpak"
          flatpak remote-info --user sele-build com.chipichapa.sele

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: sele-linux-x64
          path: dist/sele-linux-x64.flatpak
          if-no-files-found: error
          compression-level: 0

      - name: Upload Flatpak repository for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/flatpak-pages

  flatpak-pages:
    name: Publish Flatpak repository
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy Flatpak repository
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
      - linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download distributables
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: sele-*
          merge-multiple: true

      - name: Verify release contents
        run: |
          test -f release-artifacts/sele-windows-x64-setup.exe
          test -f release-artifacts/sele-macos-arm64.dmg
          test -f release-artifacts/sele-linux-x64.flatpak

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
            exit 0
          fi

          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --generate-notes \
            --title "Sele ${GITHUB_REF_NAME#v}" \
            "${prerelease_args[@]}"
