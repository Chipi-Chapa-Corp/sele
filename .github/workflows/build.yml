name: Build distributables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*-windows-*'
      - '!v*-macos-*'
      - '!v*-linux-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: 22.23.1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v${tag_version} does not match package.json version ${package_version}." >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

  bundle:
    name: Bundle application once
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # JS and renderer assets are portable. Each packaging runner still installs
      # its own native modules; validation runs in parallel and gates publishing.
      - name: Bundle main, preload and renderer
        run: node --max-old-space-size=4096 node_modules/electron-vite/bin/electron-vite.js build

      - name: Upload application bundle
        uses: actions/upload-artifact@v7
        with:
          name: application-bundle
          path: out
          if-no-files-found: error

  windows:
    name: Windows x64
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache packaging tools
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: packaging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: packaging-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci

      - name: Download application bundle
        uses: actions/download-artifact@v8
        with:
          name: application-bundle
          path: out

      - name: Build NSIS installer
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }

          npx --no-install electron-builder --win nsis --x64 --publish never

      - name: Verify artifact
        shell: pwsh
        run: |
          node scripts/verify-packaged-runtime.mjs dist/win-unpacked/resources/app.asar
          if (-not (Test-Path "dist/sele-windows-x64-setup.exe")) {
            throw "Windows installer was not produced."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: sele-windows-x64
          path: |
            dist/sele-windows-x64-setup.exe
            dist/sele-windows-x64-setup.exe.blockmap
            dist/*.yml
            !dist/builder-*.yml
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS arm64
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache packaging tools
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: packaging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: packaging-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci

      - name: Download application bundle
        uses: actions/download-artifact@v8
        with:
          name: application-bundle
          path: out

      - name: Validate Homebrew cask
        run: |
          ruby -c Casks/sele.rb
          brew style Casks/sele.rb

      - name: Test macOS update helper
        run: npm test -- appUpdate

      - name: Build unsigned DMG and update ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --mac dmg zip --arm64 --publish never

      - name: Verify artifact
        run: |
          node scripts/verify-packaged-runtime.mjs dist/mac-arm64/Sele.app/Contents/Resources/app.asar
          hdiutil verify "dist/sele-macos-arm64.dmg"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: sele-macos-arm64
          path: |
            dist/sele-macos-arm64.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
            !dist/builder-*.yml
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x64 Flatpak
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    needs: bundle
    # Keep Flatpak tooling on a release-tested image when ubuntu-latest changes.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache packaging tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: packaging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: packaging-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream flatpak pigz
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --assumeyes --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Install dependencies
        run: npm ci

      - name: Download application bundle
        uses: actions/download-artifact@v8
        with:
          name: application-bundle
          path: out

      - name: Validate AppStream metadata
        run: appstreamcli validate --strict --explain build/com.chipichapa.sele.metainfo.xml

      - name: Package Linux application
        run: npx --no-install electron-builder --linux --dir --x64 --publish never

      - name: Verify packaged runtime
        run: node scripts/verify-packaged-runtime.mjs dist/linux-unpacked/resources/app.asar

      - name: Build Flatpak repository and bundle once
        run: npm run package:flatpak-repo

      - name: Package Linux tarball
        run: npm run package:linux-tarball

      - name: Verify artifact
        run: |
          test -f dist/sele-linux-x64.flatpak
          test -f dist/sele-linux-x64.tar.gz
          archive_contents="$(tar -tzf dist/sele-linux-x64.tar.gz)"
          grep -Fxq './sele' <<< "$archive_contents"
          grep -Fxq './resources/app.asar' <<< "$archive_contents"
          test -f dist/sele.flatpakrepo
          test -f dist/flatpak-pages/flatpak/summary
          test -f dist/flatpak-pages/flatpak/sele.flatpakref
          flatpak remote-add --user --no-gpg-verify sele-build \
            "file://${GITHUB_WORKSPACE}/dist/flatpak-pages/flatpak"
          flatpak remote-info --user sele-build com.chipichapa.sele
          flatpak install --user --assumeyes --noninteractive --no-deps \
            sele-build com.chipichapa.sele
          app_location="$(flatpak info --user --show-location com.chipichapa.sele)"
          cmp LICENSE \
            "${app_location}/files/share/licenses/com.chipichapa.sele/LICENSE"

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sele-linux-x64
          path: |
            dist/sele-linux-x64.flatpak
            dist/sele-linux-x64.tar.gz
            dist/sele.flatpakrepo
          if-no-files-found: error
          compression-level: 0

      - name: Upload Flatpak repository for GitHub Pages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/flatpak-pages

  flatpak-pages:
    name: Publish Flatpak repository
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy Flatpak repository
        id: deployment
        uses: actions/deploy-pages@v4

  release-windows:
    name: Publish Windows release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: sele-windows-x64
          path: release-artifacts
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" windows-x64 release-artifacts

  release-linux:
    name: Publish Linux release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, linux, flatpak-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: sele-linux-x64
          path: release-artifacts
      - name: Publish Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" linux-x64 release-artifacts

  release-macos:
    name: Publish macOS release and Homebrew cask
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          name: sele-macos-arm64

      - name: Publish macOS release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" macos-arm64 release-artifacts

      # The tap tracks main, not the release tag. Update only after assets are public.
      - name: Check out Homebrew tap branch
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@v7
        with:
          ref: main
          path: homebrew-tap

      - name: Update Homebrew version and checksum
        if: ${{ !contains(github.ref_name, '-') }}
        run: >-
          node homebrew-tap/scripts/update-homebrew-cask.mjs
          "${GITHUB_REF_NAME}-macos-arm64" release-artifacts/sele-macos-arm64.dmg
          homebrew-tap/Casks/sele.rb

      - name: Publish Homebrew cask
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sele.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Homebrew cask for ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  legacy-release:
    name: Publish compatibility release for older updaters
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-windows, release-macos, release-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download distributables
        uses: actions/download-artifact@v8
        with:
          pattern: sele-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish compatibility release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" legacy release-artifacts
