name: CI & Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "!v*-windows-*"
      - "!v*-macos-*"
      - "!v*-linux-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(node -p "require('./apps/desktop/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v${tag_version} does not match apps/desktop/package.json version ${package_version}." >&2
            exit 1
          fi

      - name: Install native test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check i18n catalogs
        run: vp run i18n:check

      - name: Typecheck
        run: vp run typecheck

      - name: Test desktop and build scripts
        run: |
          vp run --filter @t3tools/desktop test
          vp test run scripts/build-desktop-artifact.test.ts scripts/update-release-package-versions.test.ts scripts/apply-web-brand-assets.test.ts

  bundle:
    name: Bundle desktop JS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          save-pnpm-store: "false"

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Build desktop, server, and web bundles
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: vp run build:desktop:bundle

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error

  windows:
    name: Windows x64 (.exe)
    needs: [bundle]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      - name: Build Windows NSIS installer
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "$version" \
            --output-dir release \
            --skip-build

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "release/sele-windows-x64-setup.exe")) {
            throw "Windows NSIS installer was not produced."
          }
          if (-not (Test-Path "release/sele-windows-x64-setup.exe.blockmap")) {
            throw "Windows NSIS blockmap was not produced."
          }
          if (-not (Test-Path "release/latest.yml")) {
            throw "Windows update manifest latest.yml was not produced."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sele-windows-x64
          path: |
            release/sele-windows-x64-setup.exe
            release/sele-windows-x64-setup.exe.blockmap
            release/*.yml
            !release/builder-*.yml
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS arm64 (.dmg & auto-update .zip)
    needs: [bundle]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Validate Homebrew cask syntax
        run: ruby -c Casks/sele.rb

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Test unsigned macOS updater
        working-directory: apps/desktop
        run: vp test run src/updates/macAppUpdate.test.ts src/updates/platformRelease.test.ts

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target aarch64-apple-darwin

      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      - name: Build macOS DMG and update ZIP
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          args=(
            --platform mac
            --target dmg
            --arch arm64
            --build-version "$version"
            --output-dir release
            --skip-build
          )
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" ]]; then
            args+=(--signed)
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify macOS artifacts and auto-update bundle identity
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          zip_path="release/Sele-${version}-arm64-mac.zip"
          test -f "release/sele-macos-arm64.dmg"
          test -f "$zip_path"
          test -f "release/latest-mac.yml"
          hdiutil verify "release/sele-macos-arm64.dmg"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          /usr/bin/ditto --noqtn -x -k "$zip_path" "$verify_dir"
          plist="$verify_dir/Sele.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.chipichapa.sele"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")" = "Sele"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$version"
          /usr/bin/lipo "$verify_dir/Sele.app/Contents/MacOS/Sele" -verify_arch arm64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sele-macos-arm64
          path: |
            release/sele-macos-arm64.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
            !release/builder-*.yml
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x64 (Flatpak & repo)
    needs: [bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Install Linux and Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecret-1-dev pkg-config libgtk-3-0t64 libnss3 libasound2t64 libgbm1 \
            imagemagick appstream flatpak pigz
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --assumeyes --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
          save-pnpm-store: "false"

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: resource-monitor-x86_64-unknown-linux-gnu-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Cache Linux capture helpers
        id: capture_helper_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/kde-snap-shot/target/x86_64-unknown-linux-gnu/release/t3-kde-snap-shot
            native/hyprland-snap-shot/target/x86_64-unknown-linux-gnu/release/t3-hyprland-snap-shot
          key: linux-capture-helpers-x86_64-unknown-linux-gnu-${{ hashFiles('native/kde-snap-shot/Cargo.lock', 'native/kde-snap-shot/Cargo.toml', 'native/kde-snap-shot/src/**', 'native/hyprland-snap-shot/Cargo.lock', 'native/hyprland-snap-shot/Cargo.toml', 'native/hyprland-snap-shot/src/**', 'native/hyprland-snap-shot/protocols/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true' || steps.capture_helper_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build Rust helpers
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true' || steps.capture_helper_cache.outputs.cache-hit != 'true'
        run: |
          if [[ "${{ steps.resource_monitor_cache.outputs.cache-hit }}" != "true" ]]; then
            cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          fi
          if [[ "${{ steps.capture_helper_cache.outputs.cache-hit }}" != "true" ]]; then
            cargo build --locked --release --manifest-path native/kde-snap-shot/Cargo.toml --target x86_64-unknown-linux-gnu
            cargo build --locked --release --manifest-path native/hyprland-snap-shot/Cargo.toml --target x86_64-unknown-linux-gnu
          fi

      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      - name: Validate AppStream metadata
        run: appstreamcli validate --strict --explain apps/desktop/resources/linux/com.chipichapa.sele.metainfo.xml

      - name: Package unpacked Linux desktop application
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: "true"
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          vp run dist:desktop:artifact \
            --platform linux \
            --target dir \
            --arch x64 \
            --build-version "$version" \
            --output-dir release \
            --skip-build

      - name: Build Flatpak repository and bundle
        run: node scripts/package-flatpak.mjs release/linux-unpacked release/sele-linux-x64.flatpak release/flatpak-pages

      - name: Package Linux tarball
        run: bash scripts/package-linux-tarball.sh release/linux-unpacked release/sele-linux-x64.tar.gz

      - name: Verify Flatpak repository, bundle, and tarball
        run: |
          test -f release/sele.flatpakref
          test -f release/sele.flatpakrepo
          test -f release/sele-linux-x64.flatpak
          test -f release/sele-linux-x64.tar.gz
          archive_contents="$(tar -tzf release/sele-linux-x64.tar.gz)"
          grep -Fxq './sele' <<< "$archive_contents"
          grep -Fxq './resources/app.asar' <<< "$archive_contents"
          test -f release/flatpak-pages/flatpak/summary
          test -f release/flatpak-pages/flatpak/sele.flatpakref
          flatpak remote-add --user --no-gpg-verify sele-build \
            "file://${GITHUB_WORKSPACE}/release/flatpak-pages/flatpak"
          flatpak remote-info --user sele-build com.chipichapa.sele
          flatpak install --user --assumeyes --noninteractive --no-deps \
            sele-build com.chipichapa.sele
          app_location="$(flatpak info --user --show-location com.chipichapa.sele)"
          cmp LICENSE "${app_location}/files/share/licenses/com.chipichapa.sele/LICENSE"

      - name: Upload Linux and Flatpak artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sele-linux-x64
          path: |
            release/sele-linux-x64.flatpak
            release/sele-linux-x64.tar.gz
            release/sele.flatpakref
            release/sele.flatpakrepo
          if-no-files-found: error
          compression-level: 0

      - name: Upload Flatpak repository for GitHub Pages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v4
        with:
          path: release/flatpak-pages

  flatpak-pages:
    name: Publish Flatpak repository
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy Flatpak repository
        id: deployment
        uses: actions/deploy-pages@v4

  release-windows:
    name: Publish Windows release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Download Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sele-windows-x64
          path: release-artifacts
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" windows-x64 release-artifacts

  release-linux:
    name: Publish Linux release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, linux, flatpak-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Download Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sele-linux-x64
          path: release-artifacts
      - name: Publish Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" linux-x64 release-artifacts

  release-macos:
    name: Publish macOS release and Homebrew cask
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Download macOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sele-macos-arm64
          path: release-artifacts
      - name: Publish macOS release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" macos-arm64 release-artifacts
      - name: Check out Homebrew tap branch
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          path: homebrew-tap
      - name: Update Homebrew version and checksum
        if: ${{ !contains(github.ref_name, '-') }}
        run: >-
          node homebrew-tap/scripts/update-homebrew-cask.mjs
          "${GITHUB_REF_NAME}-macos-arm64" release-artifacts/sele-macos-arm64.dmg
          homebrew-tap/Casks/sele.rb
      - name: Publish Homebrew cask
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sele.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Homebrew cask for ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  release-combined:
    name: Publish combined latest release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-windows, release-macos, release-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Download all desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sele-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish combined release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" legacy release-artifacts
