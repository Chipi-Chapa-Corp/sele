appId: com.chipichapa.sele
productName: Sele
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/@lydell/node-pty*/**
win:
  executableName: sele
  target:
    - nsis
nsis:
  artifactName: ${name}-windows-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: ${name}-macos-${arch}.${ext}
linux:
  target:
    - flatpak
  category: Development
  synopsis: Desktop AI harness for Codex
flatpak:
  artifactName: ${name}-linux-${arch}.${ext}
  runtime: org.freedesktop.Platform
  runtimeVersion: '25.08'
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: '25.08'
  branch: stable
  useWaylandFlags: true
  finishArgs:
    - --socket=wayland
    - --socket=fallback-x11
    - --share=ipc
    - --device=dri
    - --socket=pulseaudio
    - --filesystem=home
    - --share=network
    - --talk-name=org.freedesktop.Notifications
npmRebuild: false
