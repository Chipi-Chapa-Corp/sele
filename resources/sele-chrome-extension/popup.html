<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sele</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>Sele</h1>
    <p id="status" role="status">Checking connection…</p>
    <p id="error" role="alert" hidden></p>
    <details id="settings">
      <summary>Connection settings</summary>
      <form id="pairing" hidden>
        <label for="endpoint">Pairing address</label>
        <input id="endpoint" type="password" autocomplete="off" required>
        <button id="connect" type="submit">Connect</button>
      </form>
      <button id="disconnect" type="button" hidden>Disconnect</button>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
