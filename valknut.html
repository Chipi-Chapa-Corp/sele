<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swap</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1a1a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #speed {
    position: fixed; right: 16px; bottom: 16px;
    font: 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #fff; background: #000; border: 1px solid #444; border-radius: 6px;
    padding: 8px 12px; cursor: pointer; user-select: none;
  }
  #speed:hover { border-color: #888; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="speed" title="Toggle speed">speed 1×</button>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const btn = document.getElementById('speed');
  const BG = '#1a1a1a', INK = '#fff', OVERLAP = '#000';

  // --- Speed toggle ---
  const SPEEDS = [0.5, 1, 2, 4];
  let speedIdx = 1;
  btn.addEventListener('click', () => {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    btn.textContent = `speed ${SPEEDS[speedIdx]}×`;
  });

  // --- One piece: a rounded slab, slanted (fractions of the symbol size S) ---
  const W = 0.40, H = 0.62, RADIUS = 0.13, SHEAR = 0.20;
  const OFFSET = { x: 0.12, y: 0.11 };        // the two pieces rest at +OFFSET and -OFFSET
  const PIECE = new Path2D();
  PIECE.roundRect(-W / 2, -H / 2, W, H, RADIUS);

  // --- Animation: rest, then the two pieces trade places (half a turn around the centre), loop ---
  const HOLD = 0.9, MOVE = 1.1, PULL = 0.35;   // PULL: how much closer the pieces get mid-swap
  const ease = u => u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2;
  const PERIOD = HOLD + MOVE;
  const R0 = Math.hypot(OFFSET.x, OFFSET.y), A0 = Math.atan2(OFFSET.y, OFFSET.x);

  let cx = 0, cy = 0, S = 1;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(w, h) * 0.6;
    cx = w / 2; cy = h / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  function render(t) {
    const u = Math.max(0, (t - HOLD) / MOVE);
    const a = A0 + Math.PI * ease(Math.min(1, u));
    const r = R0 * (1 - PULL * Math.sin(Math.PI * Math.min(1, u)));
    const px = r * Math.cos(a), py = r * Math.sin(a);

    // both pieces in ONE path: nonzero = union, evenodd = union minus overlap
    const path = new Path2D();
    for (const sgn of [1, -1]) {
      const m = new DOMMatrix([S, 0, -SHEAR * S, S, cx + sgn * px * S, cy + sgn * py * S]);   // scale + slant + place
      path.addPath(PIECE, m);
    }
    ctx.fillStyle = BG;      ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = OVERLAP; ctx.fill(path, 'nonzero');
    ctx.fillStyle = INK;     ctx.fill(path, 'evenodd');
  }

  let t = 0, last = performance.now();
  function frame(now) {
    t = (t + (now - last) / 1000 * SPEEDS[speedIdx]) % PERIOD;
    last = now;
    render(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__seek = (sec) => { t = sec % PERIOD; last = performance.now(); render(t); };
})();
</script>
</body>
</html>
